name: Tag release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name (e.g. v0.11.0)"
        required: true
      sha:
        description: "Commit SHA the tag should point at"
        required: true

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { tag, sha } = context.payload.inputs;
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha,
            });
            core.notice(`Created tag ${tag} -> ${sha}`);
